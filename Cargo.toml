[package]
name = "pdf-r2l-script-mac"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "PDFを右綴じ(R2L・見開き右)にするmacOS GUIアプリ"

[dependencies]
lopdf = "0.42"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
strip = true
